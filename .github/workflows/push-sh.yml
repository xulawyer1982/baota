name: Build and Push ALIYUN Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g., v9.6.0_1.0)宝塔版本+构建版本'
        required: true
        default: 'v88_1.0'
      build_type:
        description: '构建 minimal / lnmp / both'
        required: true
        default: 'both'
        type: choice
        options: [minimal, lnmp, both]

env:
  REGISTRY: registry.cn-shanghai.aliyuncs.com
  NAMESPACE: xulawyer985
  IMAGE: baota

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm   
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build & push minimal-${{ matrix.arch }}
        if: ${{ github.event.inputs.build_type != 'lnmp' }}
        run: |
          docker build -t $REGISTRY/$NAMESPACE/$IMAGE:minimal-${{ matrix.arch }} \
            -f ./dockerfiles/dockerfile.baota .
          docker push $REGISTRY/$NAMESPACE/$IMAGE:minimal-${{ matrix.arch }}

      - name: Build & push lnmp-${{ matrix.arch }}
        if: ${{ github.event.inputs.build_type != 'minimal' }}
        run: |
          docker build --build-arg BASE_TAG=minimal-${{ matrix.arch }} \
            -t $REGISTRY/$NAMESPACE/$IMAGE:lnmp-${{ matrix.arch }} \
            -f ./dockerfiles/dockerfile.baota-lnmp .
          docker push $REGISTRY/$NAMESPACE/$IMAGE:lnmp-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Create manifest minimal
        if: ${{ github.event.inputs.build_type != 'lnmp' }}
        run: |
          docker buildx imagetools create \
            -t $REGISTRY/$NAMESPACE/$IMAGE:minimal \
            -t $REGISTRY/$NAMESPACE/$IMAGE:minimal-${{ github.event.inputs.image_tag }} \
            $REGISTRY/$NAMESPACE/$IMAGE:minimal-amd64 \
            $REGISTRY/$NAMESPACE/$IMAGE:minimal-arm64

      - name: Create manifest lnmp
        if: ${{ github.event.inputs.build_type != 'minimal' }}
        run: |
          docker buildx imagetools create \
            -t $REGISTRY/$NAMESPACE/$IMAGE:lnmp \
            -t $REGISTRY/$NAMESPACE/$IMAGE:lnmp-${{ github.event.inputs.image_tag }} \
            $REGISTRY/$NAMESPACE/$IMAGE:lnmp-amd64 \
            $REGISTRY/$NAMESPACE/$IMAGE:lnmp-arm64
