name: Build and Push ALIYUN Image2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g., v9.6.0_1.0) 宝塔版本+构建版本'
        required: true
        default: 'v9.6.0_1.0'

env:
  IMG: registry.cn-shanghai.aliyuncs.com/xulawyer985/baota

# 防止连续触发两次导致 manifest 互相覆盖
concurrency:
  group: baota-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # ---------- 1. 先构建，全部本地完成（带 GHA 层缓存） ----------
      - name: Build minimal-${{ matrix.arch }}
        run: |
          docker buildx build --load \
            --cache-from type=gha,scope=minimal-${{ matrix.arch }} \
            --cache-to type=gha,scope=minimal-${{ matrix.arch }},mode=max \
            -t $IMG:minimal-${{ matrix.arch }} \
            -f ./dockerfiles/dockerfile.baota .

      # 注意：buildx 容器构建器看不到本地 docker 镜像（--build-context docker-image:// 实测也无效），
      # 所以 lnmp 用 docker 默认驱动构建——直接以上一步 --load 到本地的 minimal 为基础；
      # 缓存改用 inline cache（--cache-from 指向上次推送的 lnmp 镜像，首次运行无该镜像仅警告不报错）
      - name: Build lnmp-${{ matrix.arch }}
        run: |
          docker build \
            --cache-from $IMG:lnmp-${{ matrix.arch }} \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg BASE_IMAGE=$IMG:minimal-${{ matrix.arch }} \
            -t $IMG:lnmp-${{ matrix.arch }} \
            -f ./dockerfiles/dockerfile.baota-lnmp .

      # ---------- 2. 推送前本地验证（老 Docker Hub 版有这个步骤，Aliyun 版漏了） ----------
      - name: Verify images exist
        run: |
          docker image inspect $IMG:minimal-${{ matrix.arch }} > /dev/null
          docker image inspect $IMG:lnmp-${{ matrix.arch }} > /dev/null

      # ---------- 3. 全部构建成功后，再统一推送 ----------
      - name: Push images
        run: |
          docker push $IMG:minimal-${{ matrix.arch }}
          docker push $IMG:lnmp-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Create manifest minimal
        run: |
          docker buildx imagetools create \
            -t $IMG:minimal \
            -t $IMG:minimal-${{ github.event.inputs.image_tag }} \
            $IMG:minimal-amd64 \
            $IMG:minimal-arm64

      - name: Create manifest lnmp
        run: |
          docker buildx imagetools create \
            -t $IMG:lnmp \
            -t $IMG:lnmp-${{ github.event.inputs.image_tag }} \
            $IMG:lnmp-amd64 \
            $IMG:lnmp-arm64

      # ---------- 3. 验证 manifest 双架构都在 ----------
      - name: Verify manifests
        run: |
          docker buildx imagetools inspect $IMG:lnmp-${{ github.event.inputs.image_tag }}
          docker buildx imagetools inspect $IMG:minimal-${{ github.event.inputs.image_tag }}
